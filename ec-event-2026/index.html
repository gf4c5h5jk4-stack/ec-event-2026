<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اكتشف ميولك التخصصي داخل القسم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#38B6DB;--pd:#2A9CC0;--pk:#1E8FB3;--bd:#E3E7EC;--tx:#111827;--mu:#6B7280}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:'IBM Plex Sans Arabic',Tajawal,Cairo,system-ui,sans-serif;color:var(--tx);background-color:#F3F5F7;background-image:linear-gradient(rgba(15,23,42,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.05) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:20px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:14px 20px}
.hd small{display:block;color:var(--mu);font-size:13px}.hd b{font-size:17px}
#logo{width:44px;height:44px;flex:none;color:var(--p)}#logo img,#logo svg{width:100%;height:100%;object-fit:contain}
h1{font-size:30px;line-height:1.35;text-align:center;margin:8px 0}
.sub{text-align:center;color:var(--mu);margin:0 0 20px}
.lead{color:#4B5563;line-height:1.9;margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:8px;background:var(--p);color:#fff;font-family:inherit;font-weight:700;font-size:18px;cursor:pointer}
.btn:hover{background:var(--pd)}
.btn2{background:#fff;color:var(--pk);border:1.5px solid var(--p);margin-top:10px}.btn2:hover{background:#EEF9FD}
input{width:100%;height:54px;padding:0 14px;border:1px solid var(--bd);border-radius:6px;background:#FAFAFB;font-family:inherit;font-size:16px;margin-top:8px}
input:focus,.opt:focus-visible,.btn:focus-visible,.link:focus-visible{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(56,182,219,.25)}
.lb{display:flex;align-items:center;gap:8px;font-weight:600;margin-top:20px}
.lb em{margin-inline-start:auto;font-style:normal;color:var(--mu);font-weight:400;font-size:14px}
.info{background:#F7F8F9;border:1px solid var(--bd);border-radius:8px;padding:16px;margin-top:18px}
.info h3{margin:0;padding-bottom:10px;border-bottom:1px solid var(--bd);font-size:16px;display:flex;align-items:center;gap:8px}
.info h3:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--p)}
.it{display:flex;gap:8px;margin-top:12px;color:var(--mu);line-height:1.8;font-size:15px}
.it b{color:#374151}.it .n{color:var(--p);font-weight:700}
.bar{height:6px;background:#E9EDF1;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--p);width:0;transition:width .35s}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:14px;margin:0 0 8px}
.tag{display:inline-block;background:#F1F3F5;color:var(--mu);border-radius:20px;padding:3px 12px;font-size:13px;margin:16px 0 8px}
.q{font-size:21px;line-height:1.6;margin:0 0 8px;font-weight:600}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:16px;margin-top:10px;background:#fff;border:1px solid var(--bd);border-radius:8px;font-family:inherit;font-size:16px;line-height:1.7;color:var(--tx);cursor:pointer;min-height:56px}
.opt:hover{border-color:var(--p)}
.opt .r{flex:none;width:22px;height:22px;border:2px solid #C9D0D8;border-radius:50%;display:grid;place-items:center}
.opt.on{border-color:var(--p);background:#F0FAFD}
.opt.on .r{background:var(--p);border-color:var(--p)}
.opt.on .r:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.link{background:none;border:0;color:var(--pk);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;padding:12px 4px;margin-top:8px;min-height:44px}
.link[disabled]{visibility:hidden}
.spin{width:44px;height:44px;border:4px solid #E3F4FA;border-top-color:var(--p);border-radius:50%;margin:30px auto 16px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.win{border:1.5px solid var(--c);border-radius:8px;padding:16px;margin-top:14px}
.badge{display:inline-block;color:#fff;background:var(--c);border-radius:20px;padding:3px 12px;font-size:13px}
.win h2{display:flex;align-items:center;gap:10px;margin:10px 0 6px;font-size:22px;color:var(--c)}
.win h2 svg{width:30px;height:30px;flex:none;stroke:var(--c);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.win p,.win li{color:#4B5563;line-height:1.8;margin:0}
.win h4{margin:14px 0 4px}.win ul{margin:0;padding-inline-start:20px}
.chips span{display:inline-block;background:#F1F3F5;border-radius:20px;padding:3px 12px;margin:4px 0 0;margin-inline-end:6px;font-size:14px}
.rh{margin:22px 0 0;font-size:17px}
.row{margin-top:14px}
.row .meta{color:var(--tx);font-weight:600}
.row .bar{height:12px;border-radius:6px}.row .bar i{background:var(--c);transition:width .9s ease}
.mini{margin-top:10px;border:1px solid var(--bd);border-radius:8px;padding:12px 14px;color:var(--mu);line-height:1.7;font-size:15px}
.mini b{color:var(--tx)}
#toast{position:fixed;left:0;right:0;bottom:24px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#toast span{display:inline-block;background:#111827;color:#fff;border-radius:20px;padding:10px 18px}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:380px){h1{font-size:25px}.card{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="card hd">
    <div id="logo"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="8" width="36" height="25" rx="3"/><path d="M17 41h14M24 33v8"/></svg></div>
    <div><small>جامعة طرابلس · كلية الهندسة</small><b>قسم هندسة الحاسب الآلي</b></div>
  </header>
  <main id="app" class="card" aria-live="polite"></main>
</div>
<div id="toast"><span></span></div>
<script>
// لإضافة الشعار: ضع رابط الصورة هنا، مثال: "logo.png" (الملف بجانب index.html) أو رابط base64
var LOGO_SRC = "";

var ORDER = ["AI", "CYBER", "IOT"];
var IC = {
  AI: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
  CYBER: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  IOT: '<path d="M5 12.5a10 10 0 0 1 14 0M8 15.5a6 6 0 0 1 8 0"/><circle cx="12" cy="19" r="1"/>'
};
// بيانات المسارات (مصدرها دليل القسم)
var T = {
  AI: {n: "الأنظمة الذكية والذكاء الاصطناعي", c: "#6C5CE7",
    d: "هنا تعلّم الحاسوب يفهم البيانات ويتعلم منها ويتخذ قرارات تحسّن الأداء في قطاعات مثل الرعاية الصحية والتعليم والصناعة.",
    w: ["تحليل البيانات واستخراج الأنماط منها", "تدريب نماذج تتعلم وتتوقع", "بناء أنظمة تتخذ قرارات مستقلة"],
    s: ["البرمجة", "الرياضيات والإحصاء", "التفكير التحليلي"],
    b: "أنظمة ذكية تحلل البيانات وتتعلم وتتخذ قرارات مستقلة."},
  CYBER: {n: "الأمن السيبراني", c: "#12B886",
    d: "هنا تحمي البيانات والشبكات من التهديدات الإلكترونية، وتبني حلولًا مثل التشفير وكشف التسلل وإدارة المخاطر السيبرانية.",
    w: ["حماية البيانات والشبكات من التهديدات الإلكترونية", "استخدام نظم التشفير", "كشف التسلل وإدارة المخاطر السيبرانية"],
    s: ["الشبكات وأنظمة التشغيل", "التفكير النقدي والفضول", "الدقة والصبر"],
    b: "حماية البيانات والشبكات من التهديدات الإلكترونية."},
  IOT: {n: "حلول إنترنت الأشياء (IoT)", c: "#F59F00",
    d: "هنا تصمم أجهزة مترابطة والبنية التحتية اللازمة لها، لتشغيل المدن الذكية والمنازل الذكية والأنظمة الصناعية المتقدمة.",
    w: ["تصميم أجهزة مترابطة تجمع البيانات وترسلها", "بناء البنية التحتية لتطبيقات المدن والمنازل الذكية", "تطوير أنظمة صناعية متقدمة"],
    s: ["الإلكترونيات والأنظمة المدمجة", "الشبكات والاتصالات", "البرمجة"],
    b: "أجهزة مترابطة وبنية تحتية للمدن والمنازل والأنظمة الصناعية الذكية."}
};
// الأسئلة: [عنوان الموقف، السؤال، خيار AI، خيار CYBER، خيار IOT]
var Q = [
  ["مستشفى", "مستشفى يبي يستخدم التكنولوجيا باش يحسّن متابعة المرضى، أي مشروع يحمّسك أكثر؟",
    "نظام يحلل بيانات المرضى ويساعد في اكتشاف التغيرات المهمة بكري",
    "نظام يحمي السجلات الطبية ويحدد من يقدر يوصل للمعلومات",
    "نظام يربط أجهزة متابعة المرضى بالنظام المركزي باش المعلومات توصل بشكل مستمر"],
  ["سيارات", "شركة سيارات تبي تطوّر سيارة أذكى وأكثر أمانًا، شن الجزء اللي تبي تشتغل عليه؟",
    "نظام يتعلم من طريقة سواقة السائق ويتوقع الأعطال أو يساعده أثناء القيادة",
    "نظام يمنع سرقة السيارة إلكترونيًا أو التحكم فيها عن بعد من شخص غير مصرّح له",
    "حساسات داخل السيارة مربوطة بتطبيق في الهاتف تعرض الموقع وحالة الوقود والإطارات"],
  ["جامعة", "الجامعة تبي تحسّن تجربة الطلبة، أي فكرة تشدّك أكثر؟",
    "نظام يقترح لكل طالب مواد ومصادر تناسبه ويكتشف بكري الطلبة اللي يحتاجوا دعم",
    "نظام يحمي حسابات الطلبة ونظام الدرجات من التلاعب أو الاختراق",
    "قاعات ذكية فيها حساسات تسجل الحضور وتتحكم في الإضاءة والتكييف تلقائيًا"],
  ["تطبيق", "تطبيق جديد عليه ملايين المستخدمين، شن الجزء اللي تحب تشتغل عليه؟",
    "ميزة تقترح لكل مستخدم محتوى يناسب اهتماماته",
    "حماية بيانات المستخدمين واكتشاف محاولات الدخول المشبوهة للحسابات",
    "ربط التطبيق بأجهزة المستخدم (ساعة، سماعة، أجهزة البيت) والتحكم فيها من مكان واحد"],
  ["بيت ذكي", "تبي تجهّز بيت ذكي، شن الجزء اللي يحمّسك أكثر؟",
    "مساعد صوتي يفهم كلامك ويتعلم عاداتك اليومية",
    "التأكد إن الكاميرات والأقفال ما أحد يقدر يخترقها أو يتحكم فيها من برا",
    "ربط الإضاءة والتكييف والأبواب والحساسات ببعض والتحكم فيها من تطبيق واحد"],
  ["متجر إلكتروني", "متجر إلكتروني كبير يبي يتطور، أي مشروع تختاره؟",
    "نظام يتوقع الطلب على المنتجات ويقترح على كل زبون اللي يناسبه",
    "نظام دفع آمن يمنع الاحتيال وسرقة بيانات البطاقات",
    "مخزن فيه حساسات تتابع البضاعة والشحنات لحظة بلحظة"],
  ["نادي رياضي", "نادي كرة قدم يبي يحسّن أداء فريقه، أي فكرة تشدّك؟",
    "تحليل فيديوهات المباريات لاستخراج إحصائيات وأنماط لعب اللاعبين تلقائيًا",
    "حماية بيانات النادي وتذاكر المباريات من التزوير والتسريب",
    "أجهزة يلبسها اللاعبون تقيس نبض القلب والحركة وتبعثها للمدرب مباشرة"],
  ["مزرعة", "مزرعة كبيرة تبي توفّر ماء وتزيد إنتاجها، أي حل تفضّله؟",
    "نظام يحلل صور المحصول ويكتشف الأمراض بكري",
    "حماية نظام الري والتحكم من أي تلاعب أو اختراق",
    "حساسات رطوبة التربة تشغّل الري تلقائيًا وقت الحاجة"],
  ["مدينة", "مدينة فيها زحمة سير كبيرة، أي مشروع تبي تشتغل عليه؟",
    "نظام يحلل صور الكاميرات ويتوقع الزحمة ويقترح أنسب توقيت للإشارات",
    "حماية نظام التحكم في الإشارات من أي جهة تحاول تعطّله أو تتلاعب به",
    "شبكة إشارات وحساسات في التقاطعات تتواصل مع بعضها وتتحكم في الحركة"],
  ["مشروع شخصي", "عندك أسبوع عطلة وتبي تجرب مشروع صغير لنفسك، شن تختار؟",
    "تدريب برنامج صغير يتعرف على الصور أو يتوقع شيء من بيانات",
    "تحدٍّ أمني على موقع تجريبي مسموح، تدور فيه على ثغرة أو رمز مخفي",
    "تركيب جهاز صغير بحساس يقيس الحرارة ويرسل القراءة لهاتفك"]
];

// فحص سلامة البيانات (يظهر في الـ console فقط)
(function () {
  if (Q.length !== 10) console.error("عدد الأسئلة ليس 10");
  Q.forEach(function (q, i) {
    if (q.length !== 5) console.error("السؤال " + (i + 1) + " يجب أن يحتوي 3 خيارات");
    ORDER.forEach(function (k, j) { if (!q[2 + j]) console.error("خيار ناقص في السؤال " + (i + 1) + " للمسار " + k); });
  });
})();

var app = document.getElementById("app");
var S;

function reset() { if (S) clearTimeout(S.t); S = {i: 0, a: [], o: [], name: "", lock: false, t: 0, p: {}}; }
function $(s) { return document.querySelector(s); }
function ico(k) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + IC[k] + '</svg>'; }
function shuffle(arr) {
  var a = arr.slice(), j, t, i;
  for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function toast(msg) {
  var t = $("#toast");
  t.firstChild.textContent = msg;
  t.classList.add("show");
  setTimeout(function () { t.classList.remove("show"); }, 1800);
}

// الشعار
(function () {
  if (!LOGO_SRC) return;
  var im = new Image(), l = $("#logo");
  im.alt = "";
  im.onload = function () { l.innerHTML = ""; l.appendChild(im); };
  im.src = LOGO_SRC;
})();

function intro() {
  app.innerHTML =
    '<h1>اكتشف ميولك التخصصي داخل القسم</h1>' +
    '<p class="sub">ملتقى الطلبة الجدد · قسم هندسة الحاسب الآلي</p>' +
    '<p class="lead">في السنة الرابعة ستختار أحد ثلاثة مسارات تخصصية. قبل ما توصل لها، جرّب تفكر مثل مهندس في كل مجال: 10 مواقف من حياتك اليومية، وفي كل موقف 3 حلول كلها صحيحة. اختر اللي يشدك أكثر، وفي الآخر نوريك أي مسار أقرب لطريقة تفكيرك.</p>' +
    '<label class="lb" for="nm"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38B6DB" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>الاسم الأول<em>(اختياري)</em></label>' +
    '<input id="nm" maxlength="30" autocomplete="off" placeholder="اكتب اسمك الأول">' +
    '<button class="btn" id="go" style="margin-top:18px"><span>ابدأ الاستكشاف</span><span aria-hidden="true">←</span></button>' +
    '<div class="info"><h3>كيف يعمل الاختبار؟</h3>' +
    '<div class="it"><span class="n">1.</span><span><b>المواقف:</b> 10 مواقف قريبة من حياتك (سيارات، جامعة، تطبيقات...) ولا تحتاج أي معرفة مسبقة.</span></div>' +
    '<div class="it"><span class="n">2.</span><span><b>الإجابات:</b> لا توجد إجابة خاطئة، كل الحلول منطقية، اختر ما يشدك أكثر.</span></div>' +
    '<div class="it"><span class="n">3.</span><span><b>النتيجة:</b> تعرف المسار الأقرب لميولك مع نسبة كل مسار، وهي نتيجة استرشادية فقط.</span></div></div>';
  $("#nm").value = S.name;
  $("#go").onclick = function () { S.name = $("#nm").value.trim(); showQ(); };
}

function showQ() {
  var i = S.i, q = Q[i];
  if (!S.o[i]) S.o[i] = shuffle(ORDER);
  app.innerHTML =
    '<div class="meta"><span>السؤال ' + (i + 1) + ' من ' + Q.length + '</span></div>' +
    '<div class="bar"><i style="width:' + ((i + 1) / Q.length * 100) + '%"></i></div>' +
    '<span class="tag"></span><h2 class="q"></h2><div id="os"></div>' +
    '<button class="link" id="bk">→ السابق</button>';
  app.querySelector(".tag").textContent = q[0];
  app.querySelector(".q").textContent = q[1];
  var box = $("#os");
  S.o[i].forEach(function (k) {
    var b = document.createElement("button"), r = document.createElement("span"), s = document.createElement("span");
    b.type = "button";
    b.className = "opt" + (S.a[i] === k ? " on" : "");
    b.setAttribute("data-k", k);
    r.className = "r";
    s.textContent = q[2 + ORDER.indexOf(k)];
    b.appendChild(r); b.appendChild(s);
    b.onclick = function () { pick(k); };
    box.appendChild(b);
  });
  var bk = $("#bk");
  bk.disabled = (i === 0);
  bk.onclick = function () {
    clearTimeout(S.t); S.lock = false;
    if (S.i > 0) { S.i--; showQ(); }
  };
}

function pick(k) {
  if (S.lock) return;
  S.lock = true;
  S.a[S.i] = k;
  var b = document.querySelectorAll(".opt"), j;
  for (j = 0; j < b.length; j++) b[j].classList.toggle("on", b[j].getAttribute("data-k") === k);
  S.t = setTimeout(function () {
    S.lock = false;
    if (S.i < Q.length - 1) { S.i++; showQ(); } else analyze();
  }, 350);
}

function analyze() {
  app.innerHTML = '<div class="spin"></div><p class="sub">جارٍ تحليل اختياراتك...</p>';
  S.t = setTimeout(result, 1100);
}

function blk(k) {
  var t = T[k];
  return '<div class="win" style="--c:' + t.c + '"><span class="badge">المسار الأنسب لميولك</span>' +
    '<h2>' + ico(k) + t.n + '</h2><p>' + t.d + '</p>' +
    '<h4>ماذا يمكنك أن تعمل؟</h4><ul>' + t.w.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' +
    '<h4>مهارات تفيدك</h4><div class="chips">' + t.s.map(function (x) { return '<span>' + x + '</span>'; }).join('') + '</div></div>';
}

function result() {
  var n = Q.length, c = {AI: 0, CYBER: 0, IOT: 0}, p = {};
  S.a.forEach(function (k) { c[k]++; });
  ORDER.forEach(function (k) { p[k] = Math.round(c[k] * 100 / n); });
  S.p = p;
  var rk = ORDER.slice().sort(function (a, b) { return c[b] - c[a] || ORDER.indexOf(a) - ORDER.indexOf(b); });
  var mx = c[rk[0]];
  var ld = rk.filter(function (k) { return c[k] === mx; });
  var msg = "";
  if (ld.length === 3) msg = "ميولك متوازنة بين المسارات الثلاثة";
  else if (ld.length === 2) msg = "ميولك متوازنة بين " + T[ld[0]].n + " و" + T[ld[1]].n;
  else if (p[rk[0]] - p[rk[1]] <= 10) msg = "ميولك متقاربة بين المسارين الأول والثاني";

  var h = '<h1></h1>' + (msg ? '<p class="sub" id="ms"></p>' : '');
  ld.forEach(function (k) { h += blk(k); });
  h += '<h3 class="rh">نسب ميولك</h3>';
  rk.forEach(function (k) {
    h += '<div class="row" style="--c:' + T[k].c + '"><div class="meta"><span>' + T[k].n + '</span><span class="pc" data-v="' + p[k] + '">0%</span></div>' +
      '<div class="bar"><i data-w="' + p[k] + '"></i></div></div>';
  });
  var others = rk.filter(function (k) { return ld.indexOf(k) < 0; });
  if (others.length) {
    h += '<h3 class="rh">تعرّف على باقي المسارات</h3>';
    others.forEach(function (k) { h += '<div class="mini"><b>' + T[k].n + ':</b> ' + T[k].b + '</div>'; });
  }
  h += '<div class="info"><h3>كيف تقرأ نتيجتك؟</h3>' +
    '<div class="it"><span class="n">1.</span><span>النتيجة تعكس طريقة تفكيرك في هذه المواقف فقط، وليست حكمًا نهائيًا.</span></div>' +
    '<div class="it"><span class="n">2.</span><span>الميول المتقاربة بين مسارين أو ثلاثة أمر طبيعي، فمجالات الحاسب الآلي متكاملة.</span></div>' +
    '<div class="it"><span class="n">3.</span><span>ستختار مسارك رسميًا في السنة الرابعة، فاستغل وقتك لاكتشاف المسارات الثلاثة وتحدث مع أعضاء هيئة التدريس والطلبة الأقدم.</span></div></div>' +
    '<button class="btn" id="rs" style="margin-top:18px">إعادة الاختبار</button>' +
    '<button class="btn btn2" id="sh">مشاركة النتيجة</button>';
  app.innerHTML = h;
  app.querySelector("h1").textContent = S.name ? "أهلاً " + S.name + "، هذه نتيجتك" : "نتيجتك";
  if (msg) $("#ms").textContent = msg;
  $("#rs").onclick = function () { reset(); intro(); window.scrollTo(0, 0); };
  $("#sh").onclick = share;
  window.scrollTo(0, 0);
  setTimeout(function () {
    var bars = document.querySelectorAll(".bar i[data-w]"), pcs = document.querySelectorAll(".pc"), x;
    for (x = 0; x < bars.length; x++) bars[x].style.width = bars[x].getAttribute("data-w") + "%";
    for (x = 0; x < pcs.length; x++) count(pcs[x]);
  }, 60);
}

function count(e) {
  var to = +e.getAttribute("data-v"), s = null;
  function f(ts) {
    if (!s) s = ts;
    var r = Math.min((ts - s) / 800, 1);
    e.textContent = Math.round(to * r) + "%";
    if (r < 1) requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
}

function share() {
  var tx = "اكتشفت ميولي التخصصي في قسم هندسة الحاسب الآلي – جامعة طرابلس: " +
    ORDER.map(function (k) { return T[k].n + " " + S.p[k] + "%"; }).join("، ") +
    ". جرّب أنت: " + location.href;
  if (navigator.share) { navigator.share({text: tx}).catch(function () {}); return; }
  function fb() {
    var a = document.createElement("textarea");
    a.value = tx; a.style.position = "fixed"; a.style.opacity = "0";
    document.body.appendChild(a); a.select();
    try { document.execCommand("copy"); toast("تم نسخ النتيجة"); } catch (e) {}
    document.body.removeChild(a);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(tx).then(function () { toast("تم نسخ النتيجة"); }, fb);
  } else fb();
}

reset();
intro();
</script>
</body>
</html>
